name: FingerPlus Build
on:
  push:
    branches: [arrowrip-build]
    paths:
      - 'fingerplus/**'
      - '.github/workflows/fingerplus-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
      - name: Build
        working-directory: fingerplus
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FingerPlus-Fabric-1.21.11
          path: fingerplus/build/libs/*.jar
